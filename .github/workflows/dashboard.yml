name: Dashboard PoC

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate dashboard
        env:
          GH_TOKEN: ${{ secrets.DASHBOARD_PROJECT_TOKEN }}
          DASHBOARD_ORG: itsuki-test-org
          DASHBOARD_PROJECT_NUMBER: "1"
          OUT_DIR: dist
        run: node scripts/dashboard/generate.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
